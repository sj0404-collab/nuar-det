apply plugin: 'com.android.application'

// Версия APK берётся из version.json в корне репозитория — единый источник
// правды, иначе оболочка вечно предлагает «обновление» на ту же самую версию.
def verFile = rootProject.file('../version.json')
def verJson = new groovy.json.JsonSlurper().parseText(verFile.text)
def verName = verJson.version.toString()
def verCode = verName.split('\\.').collect { it.toInteger() }.inject(1) { a, b -> a * 1000 + b }

android {
    namespace 'com.nuardet.game'
    compileSdk 36

    defaultConfig {
        applicationId "com.nuardet.game"
        minSdk 24
        targetSdk 36
        versionCode verCode
        versionName verName
    }

    signingConfigs {
        release {
            storeFile file("../release.keystore")
            storePassword "nuardet2024"
            keyAlias "nuardet"
            keyPassword "nuardet2024"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}