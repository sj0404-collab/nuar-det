name: Build APK release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      # Имя файла должно совпадать с `apk` в version.json, иначе оболочка
      # не сможет скачать обновление по ссылке с сайта.
      - name: Rename APK to match version.json
        working-directory: android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp -f "$APK" app/build/outputs/apk/release/nuar-det.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/nuar-det.apk
            android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true