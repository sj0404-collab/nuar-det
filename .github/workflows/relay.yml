name: Deploy TTS Relay (Cloudflare Worker)

on:
  push:
    branches: [master]
    paths:
      - 'workers/tts-relay.js'
      - '.github/workflows/relay.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy worker
        run: npx wrangler@latest deploy workers/tts-relay.js --name nuar-det-tts-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}